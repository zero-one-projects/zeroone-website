<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320">
  <filter id="clouds" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.012" numOctaves="3" seed="12" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="1600" height="320" filter="url(#clouds)"/>
  <rect width="1600" height="320" filter="url(#grain)" opacity="0.08"/>
</svg>
